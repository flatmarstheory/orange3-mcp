[project]
name = "orange3-mcp"
version = "0.1.0"
description = "MCP server for building and configuring Orange3 data-mining workflows and managing Orange3 add-ons"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0",
]

[project.scripts]
orange3-mcp = "orange3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orange3_mcp"]
